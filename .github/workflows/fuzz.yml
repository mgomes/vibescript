name: Fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz budget (Go -fuzztime syntax)"
        required: false
        default: "3m"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # coverage: maximum raw exec throughput to find crashes/panics.
        # oracle: every memory-estimator check is verified against the exact
        # reference walk and every recycled call frame is poisoned, so an
        # under-count (a sandbox escape) or a missed frame reuse panics.
        mode: [coverage, oracle]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fuzz suite
        env:
          VIBES_ESTIMATOR_VERIFY: ${{ matrix.mode == 'oracle' && '1' || '' }}
          VIBES_ENV_RECYCLE_VERIFY: ${{ matrix.mode == 'oracle' && '1' || '' }}
        # The oracle toggles are read only by the runtime package's test TestMain,
        # so the oracle leg fuzzes only the runtime targets (scope=runtime); the
        # ./cmd/vibes targets, a separate test binary, are covered by the coverage
        # leg where the oracle would be off anyway.
        run: just fuzz "${{ github.event.inputs.fuzztime || '3m' }}" "${{ matrix.mode == 'oracle' && 'runtime' || 'all' }}"

      - name: Upload new failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failing-inputs-${{ matrix.mode }}
          path: |
            cmd/vibes/testdata/fuzz/**
            internal/runtime/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
