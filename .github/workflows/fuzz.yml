name: Fuzz

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz budget (Go -fuzztime syntax)"
        required: false
        default: "3m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run fuzz suite
        run: just fuzz "${{ github.event.inputs.fuzztime || '3m' }}"

      - name: Upload new failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failing-inputs
          path: |
            cmd/vibes/testdata/fuzz/**
            internal/runtime/testdata/fuzz/**
          if-no-files-found: ignore
          retention-days: 30
